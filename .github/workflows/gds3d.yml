name: Publish final C40 GDS in TinyTapeout 3D Viewer

on:
  workflow_dispatch:
  push:
    branches: [H3_40ns_final, main]
    paths:
      - release/picorv32_h3_logic_ppa.gds
      - .github/workflows/gds3d.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify final KLayout GDS
        run: echo "ff8b825421fed2c00cdb22ef2641b5d19e0045c3e4460cf04c799cbac62b450f  release/picorv32_h3_logic_ppa.gds" | sha256sum --check
      - uses: actions/checkout@v6
        with:
          repository: mbalestrini/GDS2glTF
          path: GDS2glTF
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install numpy gdspy triangle pygltflib
      - name: Convert GDS to glTF
        run: |
          cp release/picorv32_h3_logic_ppa.gds GDS2glTF/picorv32_h3_logic_ppa.gds
          cd GDS2glTF
          python gds2gltf.py picorv32_h3_logic_ppa.gds | tee ../gds2gltf.log
          test -s picorv32_h3_logic_ppa.gds.gltf
      - name: Build redirect page
        run: |
          mkdir site
          cp GDS2glTF/picorv32_h3_logic_ppa.gds.gltf site/
          cp gds2gltf.log site/
          touch site/.nojekyll
          cat > site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>PicoRV32-H3 C40 3D GDS</title>
          <p>Opening the final PicoRV32-H3 C40 SKY130 layout…</p><a id="viewer">Open 3D viewer</a>
          <script>
          const model=new URL('picorv32_h3_logic_ppa.gds.gltf',location.href).href;
          const viewer='https://gds-viewer.tinytapeout.com/?model='+encodeURIComponent(model)+'&process=SKY130';
          document.getElementById('viewer').href=viewer; location.replace(viewer);
          </script>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

